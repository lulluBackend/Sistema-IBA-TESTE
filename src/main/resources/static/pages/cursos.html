<div class="content-panel">
    <div class="panel-header">
        <h3><i class="fas fa-plus-circle"></i> Novo Curso</h3>
    </div>
    <form id="cursoForm" class="form-grid">
        <div class="form-group">
            <label class="required">NOME DO CURSO</label>
            <input type="text" id="nome" required placeholder="Ex: Bacharel em Teologia">
        </div>
        <div class="form-group">
            <label>MATÉRIAS DO CURSO</label>
            <select id="materiasSelect" multiple size="6"></select>
            <small>Segure Ctrl (Windows) ou Cmd (Mac) para selecionar múltiplas matérias</small>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Salvar Curso
            </button>
            <button type="button" class="btn btn-outline" onclick="limparFormCurso()">
                <i class="fas fa-eraser"></i> Limpar
            </button>
        </div>
    </form>
    <input type="hidden" id="editCursoId">
</div>

<div class="content-panel">
    <div class="panel-header">
        <h3><i class="fas fa-list"></i> Lista de Cursos</h3>
        <button onclick="carregarCursos()" class="btn btn-sm btn-outline">
            <i class="fas fa-sync-alt"></i> Atualizar
        </button>
    </div>
    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr><th>ID</th><th>Nome do Curso</th><th>Matérias</th><th>Ações</th></tr>
            </thead>
            <tbody id="cursosList"></tbody>
        </table>
    </div>
</div>
